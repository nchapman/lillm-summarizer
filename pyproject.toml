[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyllm-summarization"
version = "0.1.0"
description = "Reproducible evaluation harness for small-model summarization"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["datasets>=3.0"]
metrics = ["rouge-score>=0.1.2"]
dev = ["pytest>=8"]

[project.scripts]
tinyllm-eval = "tinyllm_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
