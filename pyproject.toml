[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lillm-summarizer"
version = "0.1.0"
description = "Reproducible evaluation harness for small-model summarization"
requires-python = ">=3.10"
dependencies = ["datasets>=3.0", "rouge-score>=0.1.2"]

[dependency-groups]
dev = ["pytest>=8"]
# Linux NVIDIA training; the default environment stays GPU-free.
train = [
    "unsloth==2026.10.10; sys_platform == 'linux'",
    "unsloth-zoo==2026.10.10; sys_platform == 'linux'",
    "torch==2.12.1; sys_platform == 'linux'",
    "torchvision==0.27.1; sys_platform == 'linux'",
    "transformers==4.57.6; sys_platform == 'linux'",
    "trl==1.15.0; sys_platform == 'linux'",
    "peft==0.19.1; sys_platform == 'linux'",
    "datasets==4.8.5; sys_platform == 'linux'",
    "accelerate==1.14.0; sys_platform == 'linux'",
    "bitsandbytes==0.49.2; sys_platform == 'linux'",
    "huggingface-hub==0.36.2; sys_platform == 'linux'",
    "torchao==0.18.0; sys_platform == 'linux'",
    "xformers==0.0.35; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
required-version = ">=0.11.23"

[tool.uv.dependency-groups]
train = { requires-python = "==3.12.*" }

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
xformers = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
lillm-summarizer = "lillm_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
